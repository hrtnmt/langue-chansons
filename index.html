<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Langue Chansons — GitHub Pages版 | hrtnmt/langue-chansons</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f7f7;--surface:#ffffff;--text:#3c3c3c;--dim:#6b6b6b;--border:#e5e5e5;--track:#e5e5e5;--inset:#f0f0f0;--green:#58cc02;--greenD:#46a302;--blue:#1cb0f6;--blueD:#1899d6;--pink:#ff4b82;--pinkD:#e63a6e;--yellow:#ffc800;--orange:#ff9600;--orangeD:#e08600;--red:#ff4b4b;--redD:#d63a3a;--purple:#a560e0;--purpleD:#8c4ec7;--gray:#afafaf;--grayD:#8f8f8f;--quoteBg:#fffbe6;--quoteBorder:#ffe08a;--quoteTitle:#8a6100;--noteBg:rgba(255,255,255,.7);--okBg:#d7ffb8;--okText:#357a00;--badBg:#ffdfe0;--badText:#c22730;--selBg:#ddf4ff;--chipXpBg:#fff3c4;--chipXpTx:#8a6100;--chipTrBg:#d7ffb8;--chipTrTx:#357a00;--chipAcBg:#ddf4ff;--chipAcTx:#0b6f9e;--xpText:#d97a00;--startText:#c96a00;--stem:#1cb0f6;--end:#ff9600;--neut:#58cc02}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#131f24;--surface:#1f2a30;--text:#f0f0f0;--dim:#b3c2cc;--border:#37464f;--track:#37464f;--inset:#2b3a42;--quoteBg:#2e2a12;--quoteBorder:#6b5d1e;--quoteTitle:#ffd93d;--noteBg:rgba(255,255,255,.08);--okBg:#1e3a12;--okText:#8ee06a;--badBg:#402027;--badText:#ff9dab;--selBg:#14405a;--chipXpBg:#3a2f05;--chipXpTx:#ffd93d;--chipTrBg:#1e3a12;--chipTrTx:#8ee06a;--chipAcBg:#14405a;--chipAcTx:#7dd8ff;--xpText:#ffbe55;--startText:#ffb84d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55}
.fr{font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.hidden{display:none!important}
.page{max-width:600px;margin:0 auto;padding:0 16px 64px}
.chunky{border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;transition:transform .08s,filter .08s}
.chunky:active{transform:translateY(2px);border-bottom-width:2px}
.card{border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;background:var(--surface)}
.dim{color:var(--dim)}
/* language toggle (honke: two big chunky buttons) */
.langrow{display:flex;gap:8px;padding-top:12px}
.langbtn{flex:1;border:2px solid var(--grayD);border-bottom-width:4px;border-radius:16px;padding:10px 8px;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-weight:800;font-size:15px;color:#fff;background:var(--gray);transition:transform .08s}
.langbtn:active{transform:translateY(2px);border-bottom-width:2px}
.langbtn.on-fr{background:var(--blue);border-color:var(--blueD)}
.langbtn.on-pl{background:#d32f2f;border-color:#a82323}
/* stats header */
.statshead{position:sticky;top:0;z-index:10;margin:0 -16px;padding:12px 16px 8px;background:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.chip{border-radius:999px;padding:4px 12px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px}
.chip.xp{background:var(--chipXpBg);color:var(--chipXpTx)}
.chip.tr{background:var(--chipTrBg);color:var(--chipTrTx)}
.chip.ac{background:var(--chipAcBg);color:var(--chipAcTx)}
.pbar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--yellow);transition:width .5s ease}
.headdesc{margin:8px 0 0;text-align:center;font-size:14px;color:var(--dim)}
/* banners + rows */
.banner{border-radius:16px;padding:16px;color:#fff;margin-top:16px}
.banner h2{margin:0;font-family:"M PLUS Rounded 1c",sans-serif;font-size:18px;line-height:1.35}
.banner p{margin:4px 0 0;font-size:14px;opacity:.92}
.subbanner{border-radius:12px;padding:8px 12px;color:#fff;margin-top:12px;font-family:"M PLUS Rounded 1c",sans-serif;font-size:14px;font-weight:800}
.subbanner span{font-weight:500;opacity:.9}
.rows{display:grid;gap:8px;margin-top:8px}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:#fff;padding:12px 16px;font-size:15px}
.grow .num{flex:0 0 34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:15px}
.grow .tt{flex:1;min-width:0}
.grow .tt b{display:block;font-family:"M PLUS Rounded 1c",sans-serif;line-height:1.3}
.grow .tt small{display:block;font-size:12px;opacity:.92;line-height:1.35;margin-top:1px}
.pill{flex:0 0 auto;border-radius:999px;background:rgba(255,255,255,.28);padding:2px 9px;font-size:12px;font-weight:800}
.pill.next{background:rgba(255,255,255,.35)}
.grow.locked{opacity:.75}
/* winding path */
.node{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.startlabel{margin-bottom:4px;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:2px 12px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;color:var(--startText);animation:bounceY 1.2s ease-in-out infinite}
.circle{width:80px;height:80px;border-radius:50%;color:#fff;font-size:27px;display:grid;place-items:center;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800}
.nodetitle{margin:6px 0 0;max-width:200px;text-align:center;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;line-height:1.3}
.nodesub{margin:1px 0 0;max-width:200px;text-align:center;font-size:12px;color:var(--dim);line-height:1.35}
.stars{margin:2px 0 0;font-size:14px}
.about{margin-top:24px;padding:16px;font-size:14px}
.about h3{margin:0 0 4px;font-family:"M PLUS Rounded 1c",sans-serif;font-size:15px}
.about p{margin:4px 0;color:var(--dim);line-height:1.65}
.resetlink{display:block;width:100%;background:none;border:0;padding:14px 0 4px;text-align:center;font-size:14px;color:var(--dim);text-decoration:underline;min-height:44px}
/* unit detail */
.uhead{display:flex;align-items:flex-start;gap:12px;padding-top:16px}
.uhead h1{margin:0;font-family:"M PLUS Rounded 1c",sans-serif;font-size:20px;line-height:1.3}
.uhead p{margin:2px 0 0;font-size:14px;color:var(--dim)}
.backbtn{flex:0 0 auto;background:var(--surface);color:var(--text);padding:7px 14px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:15px;border-radius:12px}
.quotecard{margin-top:16px;padding:16px;background:var(--quoteBg);border-color:var(--quoteBorder)}
.quotecard .qt{margin:0;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;color:var(--quoteTitle)}
.quotecard .qf{margin:8px 0 0;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px;line-height:1.6}
.quotecard .qj{margin:4px 0 0;font-size:14px;color:var(--dim)}
.quotecard .qs{margin:12px 0 0;font-size:14px;line-height:1.65}
.notebox{margin-top:8px;border-radius:12px;padding:8px 10px;background:var(--noteBg);font-size:14px;line-height:1.6}
.speakbtn{margin-top:12px;background:var(--blue);border-color:var(--blueD);color:#fff;border-radius:999px;padding:7px 16px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px}
.sec{margin:24px 0 0;font-family:"M PLUS Rounded 1c",sans-serif;font-size:18px}
.lessonrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:#fff;padding:12px 16px;font-size:15px}
.lessonrow .ic{font-size:24px}
.lessonrow .tt{flex:1;min-width:0}
.lessonrow .tt b{display:block;font-family:"M PLUS Rounded 1c",sans-serif;line-height:1.3}
.lessonrow .tt small{display:block;font-size:12px;opacity:.92;margin-top:1px}
.cleared-note{margin-top:12px;border-radius:16px;padding:12px;text-align:center;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;background:var(--okBg);color:var(--okText)}
.wordcard{margin-top:8px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.wordcard .main{flex:1;min-width:0}
.wordcard .w{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px;line-height:1.35}
.wordcard .d{font-size:14px;color:var(--dim);margin-top:1px;line-height:1.55}
.gpill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;color:#fff;vertical-align:2px;margin-left:4px}
.speaksm{flex:0 0 auto;background:var(--blue);border-color:var(--blueD);color:#fff;border-radius:999px;padding:6px 13px;font-weight:800;font-size:14px}
.casetag{margin-top:6px;background:var(--orange);border-color:var(--orangeD);color:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.b-m{background:var(--selBg);color:var(--chipAcTx)} .b-f{background:#ffe0eb;color:#c2275a} .b-n{background:var(--okBg);color:var(--okText)} .b-v{background:#ffedd5;color:#c2410c} .b-a{background:var(--chipXpBg);color:var(--chipXpTx)}
@media(prefers-color-scheme:dark){.b-f{background:#4a1f33;color:#f9a8d4}.b-v{background:#431407;color:#fdba74}}
/* lesson player */
.lhead{display:flex;align-items:center;gap:12px;padding-top:16px}
.lbar{flex:1;height:16px;border-radius:999px;background:var(--track);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.ltag{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;white-space:nowrap}
.lsub{margin:8px 0 0;font-size:14px;color:var(--dim)}
.ltitle{margin:4px 0 0;font-family:"M PLUS Rounded 1c",sans-serif;font-size:20px;line-height:1.35}
.stepchips{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.stepchip{border-radius:999px;padding:3px 11px;font-family:"M PLUS Rounded 1c",sans-serif;font-size:12px;font-weight:800;color:#fff;background:var(--gray)}
.stepchip.done{background:var(--green)}
.flashwrap{margin-top:16px}
.flashcard{width:100%;min-height:224px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;background:var(--surface);color:var(--text)}
.flashcard .fw{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:30px;line-height:1.35}
.flashcard .fi{margin-top:8px;border-radius:999px;background:var(--inset);padding:3px 14px;font-size:14px;color:var(--dim)}
.flashcard .fh{margin-top:16px;font-size:14px;color:var(--dim)}
.flashcard .fb2{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:24px;line-height:1.4}
.flashcard .fe{margin-top:10px;font-size:14px;color:var(--dim);line-height:1.6}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.navbtn{background:var(--surface);color:var(--text);padding:8px 16px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;border-radius:12px}
.bigbtn{display:block;width:100%;margin-top:16px;padding:13px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px;color:#fff;border-radius:16px;text-align:center}
.bigbtn:disabled{opacity:.4}
.ghostbtn{display:block;width:100%;margin-top:12px;padding:13px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:16px;color:var(--text);background:var(--surface);border-radius:16px;text-align:center}
.qcard{margin-top:16px;padding:20px;background:var(--surface)}
.qprompt{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:21px;line-height:1.45}
.qsub{margin-top:4px;font-size:14px;color:var(--dim)}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.choices{display:grid;gap:8px;margin-top:16px}
.choicebtn{width:100%;text-align:left;padding:12px 16px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:16px;color:var(--text);background:var(--surface);border-radius:16px}
.choicebtn.sel{border-color:var(--blue);background:var(--selBg)}
.choicebtn.ans{border-color:var(--green);background:var(--okBg)}
.choicebtn.wrongsel{border-color:var(--red);background:var(--badBg)}
input[type=text]{width:100%;margin-top:12px;padding:12px 16px;border:2px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);font-family:"M PLUS Rounded 1c",sans-serif;font-size:18px;font-weight:700;min-height:52px}
.accents{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.accents button{border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:4px 11px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;min-height:36px}
.fbpanel{margin-top:16px;border-radius:16px;padding:16px}
.fbpanel .ft{margin:0;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px}
.fbpanel .fe{margin:6px 0 0;font-size:14px;line-height:1.65}
.fbpanel .nextbtn{display:block;width:100%;margin-top:12px;padding:12px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:17px;color:#fff;border-radius:16px;text-align:center}
.qcount{margin-top:12px;text-align:center;font-size:14px;color:var(--dim)}
.donewrap{margin-top:32px;text-align:center}
.donewrap .em{font-size:60px;line-height:1.2}
.donewrap h2{margin:10px 0 0;font-family:"M PLUS Rounded 1c",sans-serif;font-size:24px}
.donewrap p{color:var(--dim);line-height:1.65}
.donewrap .xp{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:20px;color:var(--xpText)}
/* grammar explain flow */
.subbanner2{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--quoteBg);border:2px solid var(--quoteBorder);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:16px;line-height:1.6}
.gcard{margin-top:12px;padding:16px;background:var(--surface)}
.gcard .gt{margin:0;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;color:var(--quoteTitle)}
.gcard p{font-size:14px;line-height:1.7}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
th,td{border:1px solid var(--border);padding:5px 8px;text-align:left}
th{background:var(--inset)}
.stem{color:var(--stem);font-weight:800}
.ending{color:var(--end);font-weight:800}
.exline{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.exfr{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:17px;line-height:1.6}
.modelrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.modelrow:last-child{border-bottom:0}
.modelrow .mw{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:17px}
.modelrow .mj{flex:1;font-size:14px;color:var(--dim)}
.stemdisplay{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:26px;margin-top:10px}
.stemdisplay .blank{color:var(--dim);border-bottom:3px dashed var(--orange);padding:0 10px}
.hintbox{margin-top:10px;border-radius:12px;padding:10px 12px;background:var(--inset);font-size:14px;line-height:1.65}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toolbtn{flex:1;min-width:100px;background:var(--surface);color:var(--text);padding:10px 8px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:14px;border-radius:12px}
td.hl{background:var(--selBg);outline:2px solid var(--blue)}
.footer{margin-top:32px;font-size:12px;color:var(--dim);border-top:1px solid var(--border);padding-top:12px;line-height:1.7}
.footer a{color:var(--blue)}
/* modest motion (honke-level) */
.anim-step{animation:stepIn .28s ease both}
.anim-pop{animation:popIn .35s ease both}
.anim-shake{animation:shakeX .4s ease both}
.anim-unlock{animation:unlockGlow 1.6s ease-in-out infinite}
@keyframes stepIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.92)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes unlockGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,0,0)}50%{box-shadow:0 0 0 6px rgba(255,200,0,.35)}}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<body>
<div class="page">
  <div class="langrow" role="group" aria-label="言語切替">
    <button id="btnFR" class="langbtn on-fr" onclick="setLang('fr')">🇫🇷 Français フランス語</button>
    <button id="btnPL" class="langbtn" onclick="setLang('pl')">🇵🇱 Polski ポーランド語</button>
  </div>

  <!-- PATH (home) -->
  <section id="view-home">
    <div class="statshead">
      <div class="chips">
        <span class="chip xp" id="xpChip">⭐ 0 XP</span>
        <span class="chip tr" id="trophyChip">🏆 0 / 18 ユニット</span>
        <span class="chip ac" id="gramChip">📖 文法 0 / 23</span>
      </div>
      <div class="pbar"><i id="mainProgress" style="width:0%"></i></div>
      <p class="headdesc" id="heroDesc"></p>
    </div>

    <div id="grammarArea"></div>
    <div id="pathArea"></div>

    <div class="card about" id="aboutCard"></div>
    <button class="resetlink" id="resetBtn" onclick="resetProgress(this)">進捗をリセットする</button>
  </section>

  <!-- UNIT DETAIL -->
  <section id="view-unit" class="hidden">
    <div class="uhead">
      <button class="backbtn chunky" onclick="goHome()">← パス</button>
      <div><h1 id="unitTitle"></h1><p id="unitMeta"></p></div>
    </div>
    <div class="card quotecard">
      <p class="qt" id="quoteLabel">🎭 リブレットからの引用</p>
      <p class="qf" id="unitQuote"></p>
      <button class="speakbtn chunky" id="quoteSpeak">🔊 台詞を聞く</button>
      <p class="qs" id="unitNote"></p>
    </div>
    <h2 class="sec">📚 レッスン</h2>
    <div class="rows">
      <button class="lessonrow chunky" style="background:var(--blue);border-color:var(--blueD)" onclick="startFlash()">
        <span class="ic">🃏</span>
        <span class="tt"><b>フラッシュカード</b><small id="flashSub">単語カードで意味を確認</small></span>
      </button>
      <button class="lessonrow chunky" style="background:var(--orange);border-color:var(--orangeD)" onclick="startQuiz()">
        <span class="ic">✏️</span>
        <span class="tt"><b>クイズ</b><small>4択で意味をチェック ・ 60%以上でクリア</small></span>
        <span class="pill hidden" id="unitScoreBadge"></span>
      </button>
    </div>
    <p class="dim" id="unitScore" style="font-size:14px"></p>
    <div id="unitCleared"></div>
    <div id="unitVocabSections"></div>
  </section>

  <!-- LESSON PLAYER -->
  <section id="view-lesson" class="hidden">
    <div class="lhead">
      <button class="backbtn chunky" aria-label="レッスンをやめる" onclick="cancelLesson()">✕</button>
      <div class="lbar"><i id="lessonProgress" style="width:6%"></i></div>
      <span class="ltag" id="lessonTag"></span>
    </div>
    <p class="lsub" id="lessonSub"></p>
    <h1 class="ltitle" id="lessonTitle"></h1>
    <div id="lessonBody"></div>
  </section>

  <p class="footer">出典（FR）： Ravel — L'enfant et les sortilèges, livret (Opéra de Lausanne) <a href="https://www.opera-lausanne.ch/app/uploads/2023/07/ENFANT-ET-SORTILEGES_livret_prod-2015.pdf" target="_blank" rel="noopener">PDF</a> ／ 出典（PL）： Chopin Op.74, Szymanowski Op.31 / 42 / 46bis / 49 / 58 の歌曲テクスト。学習用の抜粋・要約です。<br>このページは GitHub Pages 用の静的版です。進捗・XPはこの端末のブラウザ（localStorage）に言語別に保存されます。</p>
</div>

<script>

var lang="fr", curUnit=null, lesson=null;
function units(){return lang==="fr"?FR_UNITS:PL_UNITS}
function grammars(){return lang==="fr"?FR_GRAMMAR:PL_GRAMMAR}
function st(){return store[lang]}

function cleanSpeak(text){
  var t=(text||"").replace(/[«»]/g,"");
  t=t.replace(/\/[^\/]*\//g," "); // IPA記号は読み上げない
  t=t.split(" — ")[0].split(" → ")[0]; // 日本語の注記・矢印の後ろは読まない
  t=t.replace(/（[^）]*）/g," ").replace(/\([^)]*\)/g," "); // 注記は読まない
  t=t.replace(/[ぁ-んァ-ヶ一-龠々]/g," "); // 日本語部分は対象言語で読まない
  return t.replace(/\s+/g," ").trim();
}
function speak(text){
  try{var t=cleanSpeak(text);if(!t)return;var u=new SpeechSynthesisUtterance(t);u.lang=lang==="fr"?"fr-FR":"pl-PL";u.rate=0.92;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function speakWord(w){ // 見出し語だけを読み上げる（IPA・訳・注記は渡さない）
  try{var t=(w||"").replace(/[«»]/g,"").trim();if(!t)return;var u=new SpeechSynthesisUtterance(t);u.lang=lang==="fr"?"fr-FR":"pl-PL";u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function esc(s){return (s||"").replace(/'/g,"\\'");}
function setLang(l){lang=l;document.getElementById("btnFR").className="langbtn"+(l==="fr"?" on-fr":"");document.getElementById("btnPL").className="langbtn"+(l==="pl"?" on-pl":"");curUnit=null;curG=null;renderHome();}

function renderHome(){

  var U=units(),G=grammars();
  var cleared=U.filter(function(u){return (st().done[u.id]||0)>=60}).length;
  var gcleared=G.filter(function(g){return (st().gdone[g.id]||0)>=60}).length;

  document.getElementById("resetBtn").textContent=(lang==="fr"?"フランス語":"ポーランド語")+"の進捗をリセットする";
  // ---- grammar section (honke: purple banner + colored lesson rows, on the path) ----

  var gh='<div class="banner" style="background:var(--purple)"><h2>'+(lang==="fr"?"📖 文法入門 — 一からの通しカリキュラム":"📖 文法入門 PL — 格変化と規則ドリル")+'</h2><p>'+(lang==="fr"?"発音・冠詞から条件法・関係代名詞まで、ポーランド語版と同じ順次アンロック式。説明カード（色分け表）→ 台本の例文 → ランダムドリル。前をクリアすると次が開きます。":"ポーランド語の中心は格変化。発音 → 3性 → 7格を1つずつ（説明 → 歌曲の例文 → ランダムドリル）。前をクリアすると次が開きます。")+' クリア '+gcleared+' / '+G.length+'</p></div>';
  var lastPart="";
  G.forEach(function(g,i){
    var unlocked=i===0||((st().gdone[G[i-1].id]||0)>=60);
    var pct=st().gdone[g.id]||0, done=pct>=60, isNext=i===nextG&&unlocked;
    var color,dark;
    if(lang==="fr"){var meta=FR_GPART[g.part]||{color:"#a560e0",dark:"#8c4ec7",sub:""};color=meta.color;dark=meta.dark;
      if(g.part&&g.part!==lastPart){gh+='<div class="subbanner" style="background:'+color+'">'+g.part+' <span>— '+meta.sub+'</span></div><div class="rows">';if(lastPart)gh+="";lastPart=g.part;}
    }else{color=PL_GCOLORS[i%PL_GCOLORS.length];dark=PL_GDARKS[i%PL_GDARKS.length];if(i===0)gh+='<div class="rows">';}
    gh+='<button class="grow chunky '+(unlocked?"":"locked")+(isNext?" anim-unlock":"")+'" style="background:'+(done?"var(--green)":unlocked?color:"var(--gray)")+';border-color:'+(done?"var(--greenD)":unlocked?dark:"var(--grayD)")+'" '+(unlocked?'onclick="openGrammar(\''+g.id+'\')"':'disabled')+'><span class="num">'+(done?"✓":unlocked?(i+1):"🔒")+'</span><span class="tt"><b>'+(i+1)+'. '+g.title+'</b><small>'+g.desc+'</small></span>'+(isNext?'<span class="pill next">NEXT</span>':"")+(pct>0?'<span class="pill">ベスト '+pct+'%</span>':"")+'</button>';
    if(lang==="fr"){var nxt=G[i+1];if(!nxt||nxt.part!==g.part)gh+='</div>';}
  });
  if(lang==="pl")gh+='</div>';
  document.getElementById("grammarArea").innerHTML=gh;
  // ---- winding path ----
  var html="",lastP="",partIdx=-1,idxInPart=0;
  U.forEach(function(u,i){
    if(u.part!==lastP){partIdx++;idxInPart=0;lastP=u.part;

      +'<p class="nodetitle" style="'+(unlocked?"":"color:var(--dim)")+'">Unit '+u.id+' ・ '+u.title+'</p>'

    ?'<h3>📖 教材について</h3><p>Maurice Ravel『L\'Enfant et les sortilèges』（台本 Colette）のリブレットから、各シーンの実際の台詞を抜粋し、そこに現れる名詞・動詞・形容詞をユニット化しています。名詞は男性=青 / 女性=ピンクで色分けし、全単語にIPAと発音ボタンを付けています。</p><p>進捗・XPはこの端末のブラウザ（localStorage）に保存されます。ログイン・同期はありません。</p>'
    :'<h3>📖 教材について</h3><p>ショパン歌曲 Op.74 とシマノフスキの歌曲集（Op.31 / 42 / 46bis / 49 / 58）の歌詞から単語を抜き出しています。名詞は男性=青 / 女性=ピンク / 中性=緑の3性で色分けし、文法入門では7格の格変化を中心にドリルします。</p><p>進捗・XPはこの端末のブラウザ（localStorage）に保存されます。ログイン・同期はありません。</p>';
}
function genderBadge(v){
  if(v.t==="noun"&&v.g){var c=v.g==="m"?"b-m":(v.g==="f"?"b-f":"b-n");var lab=lang==="fr"?(v.g==="m"?"le ・ 男性":"la ・ 女性"):(v.g==="m"?"m ・ 男性":(v.g==="f"?"f ・ 女性":"n ・ 中性"));return '<span class="badge '+c+'">'+lab+'</span>';}
  if(v.t==="verb")return '<span class="badge b-v">動詞 '+(v.grp||"")+'</span>';
  if(v.t==="adj")return '<span class="badge b-a">形容詞</span>';
  return '<span class="badge b-a">'+(v.t||"")+'</span>';
}
function genderColor(g){return g==="m"?"var(--blue)":(g==="f"?"var(--pink)":"var(--green)");}
function genderPill(g){return '<span class="gpill" style="background:'+genderColor(g)+'">'+(lang==="fr"?(g==="m"?"男性":"女性"):(g==="m"?"男性":g==="f"?"女性":"中性"))+'</span>';}
function openUnit(id){
  curUnit=units().find(function(u){return u.id===id});curG=null;
  show("view-unit");
  document.getElementById("unitTitle").textContent="Unit "+curUnit.id+" "+curUnit.title;
  document.getElementById("unitMeta").textContent=curUnit.part;
  document.getElementById("quoteLabel").textContent=lang==="fr"?"🎭 リブレットからの引用":"🎭 歌詞からの引用";
  document.getElementById("unitQuote").textContent=curUnit.quote;
  var qs=document.getElementById("quoteSpeak");qs.textContent=lang==="fr"?"🔊 台詞を聞く":"🔊 歌詞を聞く";
  qs.onclick=function(){speak(curUnit.quote);};
  document.getElementById("unitNote").textContent=curUnit.note;
  var sc=st().done[curUnit.id]||0;
  var badge=document.getElementById("unitScoreBadge");
  if(sc>0){badge.classList.remove("hidden");badge.textContent="ベスト "+sc+"%";}else badge.classList.add("hidden");
  document.getElementById("unitScore").textContent=sc>=60?"前回スコア： "+sc+"% ・ クリア済み（再挑戦でもXPは加算されます）":(sc>0?"前回スコア： "+sc+"% ・ 60%以上で次ユニットが開きます":"未完了 — クイズで60%以上で次ユニットが開きます。");
  document.getElementById("unitCleared").innerHTML=sc>=60?'<p class="cleared-note">🎉 ユニットクリア！次のユニットがアンロックされました</p>':"";
  document.getElementById("flashSub").textContent="単語カード "+curUnit.vocab.length+" 枚で意味を確認";
  // vocab sections, always visible (honke style)
  var nouns=curUnit.vocab.filter(function(v){return v.t==="noun"});
  var verbs=curUnit.vocab.filter(function(v){return v.t==="verb"});
  var rest=curUnit.vocab.filter(function(v){return v.t!=="noun"&&v.t!=="verb"});
  var h="";
  if(nouns.length){h+='<h2 class="sec">'+(lang==="fr"?"🔵🩷 名詞（男性=青 / 女性=ピンク）":"🔵🩷🟢 名詞（男性=青 / 女性=ピンク / 中性=緑）")+'</h2>'+nouns.map(function(v){
    return '<div class="card wordcard" style="border-left:8px solid '+genderColor(v.g)+'"><div class="main"><span class="w">'+v.w+'</span>'+(v.g?genderPill(v.g):"")+'<p class="d">/'+v.ipa.replace(/\//g,"")+'/ ・ '+v.ja+(v.pl?' ・ 複数形 '+v.pl:"")+'</p>'+(v.caseTag?'<button class="casetag chunky" onclick="showGrammar()">🏷 '+v.caseTag+'</button>':"")+'</div><button class="speaksm chunky" aria-label="発音" onclick="speakWord(\''+esc(v.w)+'\')">🔊</button></div>';
  }).join("");}
  if(verbs.length){h+='<h2 class="sec">🏃 動詞</h2>'+verbs.map(function(v){

function lessonHead(tag,color,sub,title,pct){

function animStep(){var b=document.getElementById("lessonBody");b.classList.remove("anim-step");void b.offsetWidth;b.classList.add("anim-step");}
function startFlash(){

function flipCard(){lesson.flipped=!lesson.flipped;renderFlash();}
function prevCard(){if(lesson.idx>0){lesson.idx--;lesson.flipped=false;renderFlash();}}
function nextCard(){if(lesson.idx<lesson.items.length-1){lesson.idx++;lesson.flipped=false;renderFlash();}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(){
  var qs=curUnit.vocab.map(function(v){
    var others=shuffle(curUnit.vocab.filter(function(x){return x!==v}).map(function(x){return x.ja}));
    if(others.length<3){units().forEach(function(u){u.vocab.forEach(function(x){if(others.length<3&&x.ja!==v.ja&&others.indexOf(x.ja)<0)others.push(x.ja)});});}
    return {v:v,choices:shuffle([v.ja].concat(others.slice(0,3)))};
  });
  lesson={kind:"quiz",idx:0,score:0,qs:shuffle(qs),sel:null,checked:null};
  show("view-lesson");renderQuiz();
}
function renderQuiz(){
  var q=lesson.qs[lesson.idx];
  lessonHead("✏️ クイズ","var(--orange)","Unit "+curUnit.id+" ・ "+curUnit.title,"",50+lesson.idx/lesson.qs.length*50);
  var choices=q.choices.map(function(c,i){
    var cls="choicebtn chunky";
    if(lesson.checked!==null){if(c===q.v.ja)cls+=" ans";else if(lesson.checked===false&&c===lesson.sel)cls+=" wrongsel";}
    else if(c===lesson.sel)cls+=" sel";
    return '<button class="'+cls+'" '+(lesson.checked!==null?"disabled":'onclick="selectQuiz('+i+')"')+'>'+c+'</button>';
  }).join("");
  var bottom="";
  if(lesson.checked===null){
    bottom='<button class="bigbtn chunky" style="background:var(--green);border-color:var(--greenD)" '+(lesson.sel===null?"disabled":'onclick="checkQuiz()"')+'>チェック</button>';
  }else{
    var ok=lesson.checked;
    bottom='<div class="fbpanel '+(ok?"anim-pop":"anim-shake")+'" style="background:'+(ok?"var(--okBg)":"var(--badBg)")+'"><p class="ft" style="color:'+(ok?"var(--okText)":"var(--badText)")+'">'+(ok?"🎉 正解！":"😿 ざんねん…")+'</p><p class="fe">'+q.v.w+' /'+q.v.ipa.replace(/\//g,"")+'/ = '+q.v.ja+(q.v.pl?'（複数形 '+q.v.pl+'）':"")+(q.v.fem?'（女性形 '+q.v.fem+'）':"")+'</p><button class="speaksm chunky" onclick="speakWord(\''+esc(q.v.w)+'\')">🔊 答えを聞く</button><button class="nextbtn chunky" style="background:'+(ok?"var(--green)":"var(--red)")+';border-color:'+(ok?"var(--greenD)":"var(--redD)")+'" onclick="nextQuiz()">'+(lesson.idx+1>=lesson.qs.length?"結果を見る":"つぎへ →")+'</button></div>';
  }
  document.getElementById("lessonBody").innerHTML='<div class="qcard card"><div class="qhead"><div><p class="qprompt" style="margin:0">'+q.v.w+'</p><p class="qsub">/'+q.v.ipa.replace(/\//g,"")+'/ — 意味は？</p></div><button class="speaksm chunky" style="padding:9px 16px" onclick="speakWord(\''+esc(q.v.w)+'\')">🔊</button></div><div class="choices">'+choices+'</div></div>'+bottom+'<p class="qcount">'+(lesson.idx+1)+' / '+lesson.qs.length+' 問 ・ 現在 '+lesson.score+' 正解</p>';
  animStep();
}
function selectQuiz(i){lesson.sel=lesson.qs[lesson.idx].choices[i];renderQuiz();}
function checkQuiz(){
  var q=lesson.qs[lesson.idx];
  lesson.checked=(lesson.sel===q.v.ja);
  if(lesson.checked){lesson.score++;st().xp+=10;save();}
  renderQuiz();
}
function nextQuiz(){lesson.idx++;lesson.sel=null;lesson.checked=null;if(lesson.idx>=lesson.qs.length){finishQuiz();}else renderQuiz();}
function finishQuiz(){
  var pct=Math.round(lesson.score/lesson.qs.length*100);
  var prev=st().done[curUnit.id]||0; if(pct>prev)st().done[curUnit.id]=pct;
  save();
  lessonHead("✏️ クイズ","var(--orange)","Unit "+curUnit.id+" ・ "+curUnit.title,"",100);
  document.getElementById("lessonBody").innerHTML='<div class="donewrap anim-pop"><p class="em" style="margin:0">'+(lesson.score===lesson.qs.length?"🏆":pct>=60?"⭐":"💪")+'</p><h2>'+lesson.score+' / '+lesson.qs.length+' 正解！</h2><p>'+(pct>=60?"クリア条件（60%以上）達成！次のユニットがアンロックされました。":"クリア条件は60%以上。カードで復習してもう一度挑戦しよう。")+'</p><p class="xp">+'+ (lesson.score*10) +' XP ゲット！</p><button class="bigbtn chunky" style="background:var(--green);border-color:var(--greenD)" onclick="openUnit('+curUnit.id+')">ユニットに戻る</button><button class="ghostbtn chunky" onclick="startFlash()">もう一度練習する</button></div>';
}

    f17:'<table><tr><th>語尾</th><td><span class="ending">-ais / -ais / -ait / -ions / -iez / -aient</span></td></tr></table><p>語幹は nous の現在形から -ons を取ったもの： nous cherchons → <span class="stem">cherch-</span> + <span class="ending">ais</span> = je cherchais</p><table><tr><th>半過去</th><th>複合過去</th></tr><tr><td>背景・継続・習慣・様子</td><td>完了した出来事・きっかけ</td></tr><tr><td>Tu me cherchais（探していた）</td><td>Soudain, tu as cassé la tasse.（突然壊した）</td></tr></table>',

  var se=splitStemEnding(raw.answer);it.stem=se.stem;it.ending=se.ending;
  // FR活用ドリルは「主語＋動詞（時制）」表記を自然な日本語文に書き換える
  if(lang==="fr"){var m=raw.prompt.match(/^(je|tu|il|nous|vous|ils) \+ ([a-zàâäéèêëîïôöùûüç]+)（(.+)）/);if(m&&FR_VJA[m[2]]){it.prompt=m[2]+"『"+FR_VJA[m[2]]+"』— "+m[3]+"で『"+FR_SJA[m[1]]+"が"+FR_VJA[m[2]]+"』という形（主語 "+m[1]+"）は？";}}
  // 4択の誤答：同じレッスンの他の答え＋語尾違いから作る
  var ch=[raw.answer],tries=0;
  while(ch.length<4&&tries<24){tries++;var o=genDrillRaw();if(o&&o.answer&&ch.indexOf(o.answer)<0)ch.push(o.answer);}
  var altEnds=lang==="pl"?["łem","łam","ła","i","ą","em","a","u","e"]:["e","es","ons","ez","ent","ais","is","it"];
  var ai=0;while(ch.length<4&&ai<altEnds.length){var cand=it.stem+altEnds[ai];ai++;if(ch.indexOf(cand)<0&&cand!==raw.answer)ch.push(cand);}
  while(ch.length<4)ch.push(raw.answer+"x");
  it.choices=shuffle(ch.slice(0,4));
  return it;
}
function decompHTML(it){
  return '<span class="stemdisplay"><span class="stem">'+it.stem+'</span><span style="color:var(--dim)"> + </span><span class="ending">'+it.ending+'</span><span style="color:var(--dim)"> = </span>'+it.answer+'</span>';
}
function curQ(){return lesson.queue[lesson.qIdx];}
function renderDrill(){
  var q=curQ();drillCur=q.item;lesson.checked=null;lesson.hintLvl=0;lesson.sel=null;lesson.idx=lesson.qIdx;
  lessonHead("📖 文法入門","var(--purple)",curG.title,"",15+lesson.qIdx/Math.max(1,lesson.total)*85);
  var it=q.item;
  var stageNames=["ステップ1/3：まず選んでみよう（4択）","ステップ2/3：語尾だけ作ろう","ステップ3/3：全部自分で書こう"];
  var accents=lang==="fr"?["é","è","ê","à","ç","î","ô","ù","ï","ë"]:["ą","ć","ę","ł","ń","ó","ś","ź","ż"];
  var body=stepChips(2)
    +'<div class="qcard card"><p class="qsub" style="margin:0 0 6px;font-weight:800;color:var(--purple)">'+stageNames[q.stage]+'</p>'
    +'<p class="qprompt" style="margin:0">'+it.prompt+'</p>';
  if(q.stage===0){
    body+='<div class="choices">'+it.choices.map(function(c,i){return '<button class="choicebtn chunky" id="ch'+i+'" onclick="selectDrillChoice('+i+')">'+c+'</button>';}).join("")+'</div>';
  }else if(q.stage===1){
    body+='<p class="stemdisplay"><span class="stem">'+it.stem+'</span><span class="blank">＿＿</span></p><p class="qsub">青い語幹は表示済み。オレンジの語尾だけを入力しよう。</p>'
      +'<input type="text" id="drillInput" placeholder="語尾だけ入力" autocomplete="off" autocapitalize="off" onkeydown="if(event.key===\'Enter\')checkDrill()">'
      +'<div class="accents">'+accents.map(function(ch){return '<button type="button" aria-label="文字 '+ch+' を入力" onclick="addAccent(\''+ch+'\')">'+ch+'</button>';}).join("")+'</div>';
  }else{
    body+='<input type="text" id="drillInput" placeholder="答えを全部入力" autocomplete="off" autocapitalize="off" onkeydown="if(event.key===\'Enter\')checkDrill()">'
      +'<div class="accents">'+accents.map(function(ch){return '<button type="button" aria-label="文字 '+ch+' を入力" onclick="addAccent(\''+ch+'\')">'+ch+'</button>';}).join("")+'</div>';
  }
  body+='<div id="hintArea"></div><div id="tableArea" class="hidden"><div class="hintbox"><p style="margin:0 0 4px"><b>📊 変化表</b>（目標の語尾を探そう）</p>'+paradigmHTML()+'</div></div><div id="fb"></div></div>'
    +'<div class="toolrow"><button class="toolbtn chunky" onclick="toggleTable()">📊 表を見る</button><button class="toolbtn chunky" onclick="useHint()">💡 ヒント</button><button class="toolbtn chunky" onclick="dontKnow()">🤔 分からない</button></div>'
    +'<button class="bigbtn chunky" id="drillMainBtn" style="background:var(--green);border-color:var(--greenD)" onclick="checkDrill()">チェック</button>'
    +'<p class="qcount">'+(lesson.qIdx+1)+' / '+lesson.total+' ステップ ・ 正解 '+lesson.score+'</p>';
  document.getElementById("lessonBody").innerHTML=body;
  animStep();
  if(q.stage>0)setTimeout(function(){var el=document.getElementById("drillInput");if(el)el.focus();},60);
}
function toggleTable(){var t=document.getElementById("tableArea");if(t)t.classList.toggle("hidden");}
function selectDrillChoice(i){if(lesson.checked!==null)return;lesson.sel=curQ().item.choices[i];var btns=document.querySelectorAll(".choicebtn");btns.forEach(function(b,k){b.classList.toggle("sel",curQ().item.choices[k]===lesson.sel);});}
function useHint(){
  if(lesson.checked!==null)return;var it=curQ().item;lesson.hintLvl++;
  var area=document.getElementById("hintArea");
  if(lesson.hintLvl===1){area.innerHTML='<div class="hintbox">💡 ヒント1：変化表の該当セルを見てみよう。語尾は「<b>'+it.ending.charAt(0)+'…</b>」で始まります。下の「📊 表を見る」でも確認できます。</div>';var t=document.getElementById("tableArea");if(t)t.classList.remove("hidden");}
  else{area.innerHTML='<div class="hintbox">💡 ヒント2：語尾はそのまま <span class="ending">-'+it.ending+'</span> です。<span class="stem">'+it.stem+'</span> の後ろに付けてみよう。</div>';}
}
function drillFeedback(ok,title){
  var it=curQ().item;
  document.getElementById("fb").innerHTML='<div class="fbpanel '+(ok?"anim-pop":"anim-shake")+'" style="background:'+(ok?"var(--okBg)":"var(--badBg)")+'"><p class="ft" style="color:'+(ok?"var(--okText)":"var(--badText)")+'">'+title+'</p>'+decompHTML(it)+'<p class="fe">'+it.explain+'</p><button class="speaksm chunky" onclick="speakWord(\''+esc(it.answer)+'\')">🔊 答えを聞く</button><button class="nextbtn chunky" style="background:'+(ok?"var(--green)":"var(--red)")+';border-color:'+(ok?"var(--greenD)":"var(--redD)")+'" onclick="nextDrill()">'+(lesson.qIdx+1>=lesson.total?"結果を見る":"つぎへ →")+'</button></div>';
  var mb=document.getElementById("drillMainBtn");if(mb)mb.style.display="none";
}
function dontKnow(){
  if(lesson.checked!==null)return;lesson.checked=false;
  // ペナルティで終わらせず、この形は後でもう一度（全文入力で）出題する
  lesson.queue.push({item:curQ().item,stage:2});lesson.total=lesson.queue.length;
  var el=document.getElementById("drillInput");if(el)el.disabled=true;
  drillFeedback(false,"📖 答えを見て覚えよう（あとでもう一度出ます）");
}
function checkDrill(){
  if(lesson.checked!==null)return;
  var q=curQ(),it=q.item,given=null,target=null;
  if(q.stage===0){if(lesson.sel===null)return;given=lesson.sel;target=it.answer;}
  else{var el=document.getElementById("drillInput");if(!el||!el.value.trim())return;given=el.value;target=(q.stage===1?it.ending:it.answer);el.disabled=true;}
  var ok=norm(given)===norm(target);
  lesson.checked=ok;lesson.attempts++;
  if(ok&&lesson.hintLvl<2)lesson.score++;
  drillFeedback(ok,ok?"🎉 正解！":"😿 ざんねん…作り方を確認しよう");
}
function nextDrill(){
  lesson.qIdx++;
  if(lesson.qIdx>=lesson.total){
    var denom=Math.max(1,lesson.attempts);var pct=Math.round(lesson.score/denom*100);
    if(pct>=60){var prev=st().gdone[curG.id]||0;if(pct>prev)st().gdone[curG.id]=pct;st().xp+=lesson.score*10;save();}
    lessonHead("📖 文法入門","var(--purple)",curG.title,"",100);
    document.getElementById("lessonBody").innerHTML='<div class="donewrap anim-pop"><p class="em" style="margin:0">'+(pct>=60?"⭐":"💪")+'</p><h2>正解 '+lesson.score+' / '+denom+' ステップ！</h2><p>'+(pct>=60?"クリア条件（60%以上）達成！次の文法レッスンが開きました。4択→語尾→全文の順で、自分の力で書けるようになりました。":"クリア条件は60%以上。表とモデル語を見直して、もう一度挑戦しよう。")+'</p>'+(pct>=60?'<p class="xp">+'+(lesson.score*10)+' XP ゲット！</p>':"")+'<button class="bigbtn chunky" style="background:var(--purple);border-color:var(--purpleD)" onclick="startDrill()">もう一度ドリル（新しい組み合わせ）</button><button class="ghostbtn chunky" onclick="openGrammar(\''+curG.id+'\')">規則の表に戻る</button><button class="ghostbtn chunky" onclick="showGrammar()">文法入門の一覧に戻る</button></div>';
  }else renderDrill();
}
function addAccent(ch){var el=document.getElementById("drillInput");if(!el||el.disabled)return;el.value+=ch;el.focus();}
function norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ");}
function cancelLesson(){
  if(lesson&&lesson.kind==="grammar"){showGrammar();}
  else if(curUnit){openUnit(curUnit.id);}
  else goHome();
}
var resetArmed=false;
function resetProgress(btn){
  if(!resetArmed){resetArmed=true;btn.textContent="本当にリセット？ もう一度タップで確定";setTimeout(function(){resetArmed=false;btn.textContent=(lang==="fr"?"フランス語":"ポーランド語")+"の進捗をリセットする";},3500);return;}
  store[lang]={xp:0,done:{},gdone:{}};save();resetArmed=false;renderHome();
}

renderHome();
</script>
</body>
</html>
